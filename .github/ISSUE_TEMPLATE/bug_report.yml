name: Bug report
description: Report a reproducible Sub2API Plus defect
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include real API keys, OAuth tokens, account exports, proxy credentials, or production logs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.2.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Binary/systemd
        - Source development
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include sanitized errors and the affected endpoint or workflow.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic credentials and data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets, account data, and proxy credentials.
          required: true
        - label: I checked the latest stable release and existing issues.
          required: true
